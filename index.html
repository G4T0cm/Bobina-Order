<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tribunal Bobina</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c0b33;--gold:#ffd23f;--pur:#8e44ff;--red:#e0245e;--grn:#4fd18b;--lav:#b98cff;--card:rgba(241,230,255,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#150a26;font:700 15px 'Comic Sans MS','Comic Neue',system-ui,sans-serif;color:var(--ink)}
canvas{display:block}
.ui{position:fixed;z-index:5}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{font:400 19px Bangers,Impact,sans-serif;letter-spacing:1.2px;padding:8px 15px;background:linear-gradient(180deg,#ffe46b,#ffc21a);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink),0 8px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55);cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 6px 0 var(--ink),0 12px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.3)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5cc8ff;outline-offset:2px}
.btn.red{background:linear-gradient(180deg,#ff4a82,#c21548);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(180deg,#7cf0b3,#2fb872)}
.btn.blue{background:linear-gradient(180deg,#d4b5ff,#a374f0)}
.btn.purple{background:linear-gradient(180deg,#a96bff,#6f27d6);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.on,.btn.sel{background:#fff;outline:4px solid var(--red);outline-offset:1px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.card{background:var(--card);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink),0 14px 30px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.55);padding:12px}
.tag{padding:5px 11px;border-width:3px;box-shadow:0 3px 0 var(--ink),0 6px 10px rgba(0,0,0,.3);font-size:14px;border-radius:999px}
input,select{font:inherit;padding:9px 11px;border:3px solid var(--ink);border-radius:10px;background:#fff;max-width:100%;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 50%,rgba(20,4,40,.7) 100%),linear-gradient(180deg,rgba(255,200,255,.04),transparent 30%)}
#intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(110,40,190,.85),rgba(20,6,40,.95) 70%);backdrop-filter:blur(6px);padding:16px;text-align:center;z-index:10;overflow:auto}
#intro::before{content:'★ ★ ★';position:absolute;top:4%;left:0;right:0;font-size:28px;letter-spacing:22px;color:var(--gold);opacity:.55;animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25;transform:scale(.96)}to{opacity:.75;transform:scale(1.04)}}
h1{font:400 clamp(38px,8vw,78px) Bangers,Impact,sans-serif;margin:0;color:var(--gold);letter-spacing:3px;text-shadow:3px 3px 0 var(--pur),6px 6px 0 #000,0 0 30px rgba(255,210,63,.55);animation:flo 3s ease-in-out infinite alternate}
@keyframes flo{to{transform:translateY(-6px) rotate(-1deg)}}
#caseI{color:#fff;font-size:19px;margin:12px 0 16px;padding:6px 18px;background:rgba(255,255,255,.1);border:2px dashed rgba(255,210,63,.6);border-radius:999px}
#intro b.step{color:var(--gold);font:400 24px Bangers,Impact,sans-serif;letter-spacing:1.5px;margin-top:14px;text-shadow:2px 2px 0 #000}
#intro small{color:#cbb8e8;margin-top:16px;max-width:560px;line-height:1.4}
#lobbyMsg{min-height:22px;margin:10px 0 0;color:#ffb3ba}
#code{width:140px;text-align:center;text-transform:uppercase;letter-spacing:4px;font-size:18px}
#top{top:10px;left:10px;right:230px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#side{top:10px;right:10px;width:210px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
#roster{padding:10px 12px;max-height:38vh;overflow:auto}
#roster b{font:400 19px Bangers,Impact,sans-serif;letter-spacing:1px}
.rr{display:flex;gap:7px;align-items:center;font-weight:700;margin-top:6px;font-size:14px;padding:3px 6px;border-radius:8px;transition:background .15s}
.rr.spk{background:rgba(46,204,113,.25)}
.dot{width:12px;height:12px;border-radius:50%;background:#bbb;border:2px solid var(--ink);flex:none}
.rr.spk .dot{background:#2ecc71;box-shadow:0 0 12px #2ecc71}
.rr.pend::after{content:'⏳ conectando';font-size:11px;opacity:.7;font-weight:400}
.rr.fail::after{content:'❌ sin voz';font-size:11px;color:#c2233a}
.rr.pun::after{content:'💣 castigado';font-size:11px;color:#c2233a;font-weight:700}
#evBox small{display:block;margin:6px 0;font-weight:400}
#evBox input{width:100%}
#screen{left:50%;top:50%;transform:translate(-50%,-50%);width:min(78vw,940px);z-index:8}
#sc iframe,#sc video,#sc img{width:100%;max-height:68vh;aspect-ratio:16/9;object-fit:contain;border:3px solid var(--ink);border-radius:10px;background:#000;display:block}
#sc a{color:#6a1fc2}
#saludar,#himnoBtn{position:fixed;width:min(320px,80vw);left:calc(50% - min(320px,80vw)/2);bottom:22%;font-size:44px;padding:14px 20px;z-index:7;border-radius:18px}
#saludar{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 4px 0 var(--ink),0 0 34px rgba(142,68,255,.9)}}
#prep{width:min(520px,90vw);left:calc(50% - min(520px,90vw)/2);top:18%;text-align:center;font:400 clamp(30px,6vw,52px) Bangers,Impact,sans-serif;letter-spacing:2px;background:linear-gradient(180deg,#ffe46b,#ffc21a);pointer-events:none;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#prep,#saludar,h1,#intro::before{animation:none}}
#micS{left:10px;bottom:10px;width:min(340px,92vw);font-size:16px}
#micS .big{font:400 25px Bangers,Impact,sans-serif;letter-spacing:1px;display:block}
#micS.open{background:rgba(201,247,222,.95);box-shadow:0 6px 0 var(--ink),0 0 26px rgba(46,204,113,.7)}
#micS.closed{background:rgba(230,224,239,.92)}
#micS.dead{background:rgba(255,209,213,.95)}
#meterW{height:14px;border:3px solid var(--ink);border-radius:8px;background:#fff;margin-top:8px;overflow:hidden}
#meter{height:100%;width:0;background:linear-gradient(90deg,#2ecc71,#ffd23f,#e0245e);transition:width .06s}
#judgeP{right:230px;bottom:10px;width:min(460px,calc(100vw - 250px));max-height:calc(100vh - 70px);overflow:auto;resize:both;min-width:300px}
#judgeP>b{font:400 24px Bangers,Impact,sans-serif;letter-spacing:1.5px}
#judgeP .btn{width:100%;margin:0}
#judgeP .row .btn{width:auto;flex:1}
#judgeP input{width:100%}
#pv{margin-top:8px;padding:8px;background:#fff;border:3px dashed var(--pur);border-radius:12px}
#pv img,#pv video,#pv iframe{width:100%;aspect-ratio:16/9;max-height:300px;object-fit:contain;border:2px solid var(--ink);border-radius:6px;background:#000;display:block;margin-top:6px}
#banner{position:fixed;left:50%;top:36%;z-index:9;pointer-events:none;padding:6px 38px;border:6px solid var(--ink);border-radius:16px;box-shadow:10px 10px 0 var(--ink),0 0 50px rgba(255,255,255,.25);font:400 clamp(34px,9vw,108px) Bangers,Impact,sans-serif;color:var(--ink);white-space:nowrap;transform:translate(-50%,-50%) rotate(-4deg);animation:pop .45s cubic-bezier(.2,1.8,.4,1);text-shadow:3px 3px 0 rgba(255,255,255,.4)}
@keyframes pop{from{transform:translate(-50%,-50%) rotate(-4deg) scale(.15)}}
@media (prefers-reduced-motion:reduce){#banner{animation:none}}
@media (max-width:700px){#top{right:10px;top:56px}#side{width:auto;flex-direction:row;flex-wrap:wrap;top:10px}#roster{display:none}#judgeP{right:10px;width:min(460px,calc(100vw - 20px));bottom:150px;max-height:calc(100vh - 230px)}#micS{width:min(300px,60vw)}}
</style>
</head>
<body>
<div id="vig"></div>

<div id="intro" class="ui">
  <h1>TRIBUNAL BOBINA</h1>
  <p id="caseI"></p>
  <b class="step">1 · ¿Qué papel juegas?</b>
  <div class="row" style="justify-content:center">
    <button class="btn pick" data-r="juez">👨‍⚖️ Juez</button>
    <button class="btn pick blue" data-r="fiscal">⭐ Fiscal</button>
    <button class="btn pick purple" data-r="abogf">💼 Abogado del Fiscal</button>
    <button class="btn pick red" data-r="acusado">🙈 Acusado</button>
    <button class="btn pick purple" data-r="abogd">🛡️ Abogado de la Defensa</button>
    <button class="btn pick green" data-r="jurado" title="Puede haber varios jurados">👥 Jurado (varios)</button>
  </div>
  <b class="step">2 · Sala de voz</b>
  <div class="row" style="justify-content:center;align-items:center">
    <button class="btn green" id="create">🆕 Crear sala</button>
    <span style="color:#fff">o</span>
    <input id="code" placeholder="CÓDIGO" maxlength="5" autocomplete="off" aria-label="Código de sala">
    <button class="btn blue" id="join">🎧 Unirse</button>
  </div>
  <p id="lobbyMsg" role="status"></p>
  <small> Justicia Bobinista, por y para la Bobina.</small>
</div>

<div id="top" class="ui">
  <span class="card tag" id="caseT"></span>
  <span class="card tag" id="turnLbl"></span>
  <button class="btn tag blue" id="roomChip" title="Copiar código de sala"></button>
  <button class="btn tag" id="mute" title="Efectos de sonido">🔊</button>
  <button class="btn tag" id="music" title="Música de fondo: silenciar / activar">🎵</button>
  <button class="btn tag red hidden" id="again">Nuevo juicio</button>
</div>

<div id="side" class="ui">
  <div id="roster" class="card"></div>
  <button class="btn green hidden" id="himnoBtn">▶ REPRODUCIR HIMNO</button>
  <button class="btn purple" id="saludar">¡SALUDAR!</button>
  <button class="btn blue" id="evBtn">📎 Presentar prueba</button>
  <button class="btn red" id="obj">¡OBJECIÓN!</button>
  <div id="evBox" class="card hidden">
    <input id="evUrl" placeholder="https://… imagen, YouTube, Medal.tv, .mp4" autocomplete="off">
    <small>Imagen, GIF, YouTube, Medal.tv, .mp4 o enlace web. El Juez decide si se muestra.</small>
    <button class="btn" id="evGo">¡Presentar!</button>
  </div>
</div>

<div id="screen" class="ui card hidden">
  <div id="sc"></div>
  <div class="row" id="scCtl">
    <button class="btn tag blue" id="scPause">⏸ Pausar</button>
    <button class="btn tag green" id="scPlay">▶ Reanudar</button>
    <button class="btn tag red" id="scClose">✕ Quitar</button>
  </div>
  <div class="row" id="scLocal"><button class="btn tag" id="scHide">✕ Ocultar para mí</button></div>
</div>

<div id="micS" class="ui card closed">
  <span class="big" id="micT"></span>
  <span id="micD"></span>
  <span id="micC" style="display:block;font-size:13px;margin-top:4px;font-weight:400"></span>
  <div id="meterW"><div id="meter"></div></div>
  <div class="row"><button class="btn tag" id="selfMute">🎙️ Silenciarme</button><button class="btn tag blue" id="reVoice" title="Volver a conectar el audio">🔄 Reconectar voz</button></div>
</div>

<div id="judgeP" class="ui card hidden">
  <b>⚖️ Panel del Juez</b>
  <div class="row"><button class="btn green" id="phaseBtn"></button></div>
  <div id="pv" class="hidden"></div>
  <div class="row"><input id="caseIn" placeholder="Nombre del caso" maxlength="90" aria-label="Nombre del caso"><button class="btn tag" id="caseGo">✏️ Cambiar caso</button></div>
  <div class="row"><button class="btn purple" id="modeBtn"></button></div>
  <div class="row"><button class="btn blue" id="t_fiscal">🎤 Fiscal+Abog.</button><button class="btn blue" id="t_acusado">🎤 Defensa+Abog.</button><button class="btn blue" id="t_jurado">🎤 Jurado</button></div>
  <div class="row"><button class="btn" id="sil">🔨 ¡Silencio en la sala!</button></div>
  <div class="row"><select id="pSel" aria-label="A quién castigar"></select><button class="btn red" id="pBtn">💣 Castigar 30s</button></div>
  <div class="row"><button class="btn red" id="guilty">Culpable</button><button class="btn green" id="inno">Inocente</button></div>
</div>

<div id="prep" class="ui card hidden">¡PREPÁRATE PARA SALUDAR!</div>
<div id="banner" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const FLAG_URL='https://cdn.discordapp.com/attachments/1517157079360606208/1569763488421642260/banderabobina.png?ex=6af5f52c&is=6af4a3ac&hm=ab2557220a881820f1062053f256a7d8b5db1c372d15b42c31e5e6e27d1ef32c&';
const LOGO_URL='https://media.discordapp.net/attachments/1517157079360606208/1549936755124477962/IMG_3910-Photoroom.png?ex=6af5add6&is=6af45c56&hm=a0cac0a7e927f374065650b5b2340f614b8d3a603653a26775c6c04e3bccfafc&=&format=webp&quality=lossless';
const R={juez:'Juez',fiscal:'Fiscal',abogf:'Abogado del Fiscal',acusado:'Acusado',abogd:'Abogado de la Defensa',jurado:'Jurado'};
const ICON={juez:'👨‍⚖️',fiscal:'⭐',abogf:'💼',acusado:'🙈',abogd:'🛡️',jurado:'👥'};
const TEAMS={fiscal:['fiscal','abogf'],acusado:['acusado','abogd'],jurado:['jurado']};
const TL={fiscal:'Fiscal + Abogado',acusado:'Defensa + Abogado',jurado:'Jurado'};
const CASES=['El Soviet Bobina contra el Camarada Hilo Suelto','El Pueblo contra el Traidor del Canal General','Caso 404: el misterio del mod desaparecido','La Bobina contra el Camarada que dejó el micro abierto'];
let me=null,turn=null,mode='libre',over=false,mute=false,selfMute=false,camOv=null,talk={},nEv=0,caseIdx=0,caseName='',lastEv=null,lastVerdict=null;
let punished={},pending=[],objUntil=0,objAt={};

/* ===================== ESCENA ===================== */
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const scene=new THREE.Scene();
scene.background=lin(0x170a2a);
scene.fog=new THREE.Fog(lin(0x230f3d),24,62);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setSize(innerWidth,innerHeight);
ren.outputEncoding=THREE.sRGBEncoding;
ren.toneMapping=THREE.ACESFilmicToneMapping;
ren.toneMappingExposure=1.25;
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(ren.domElement);

const hemi=new THREE.HemisphereLight(0xf0d8ff,0x3a1a5a,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe6d0,.9);
sun.position.set(6,14,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-18,right:18,top:16,bottom:-16,near:1,far:42});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);sun.target.position.set(0,0,-2);
const moon=new THREE.DirectionalLight(0xa88fff,.55);moon.position.set(16,7,0);scene.add(moon);
const rim=new THREE.DirectionalLight(0xff8ad8,.35);rim.position.set(-10,6,-10);scene.add(rim);
/* foco dorado sobre el estrado del juez */
const judgeSpot=new THREE.SpotLight(0xffe9a8,1.6,30,.5,.7,1);
judgeSpot.position.set(0,9,-3);judgeSpot.target.position.set(0,2.5,-8);scene.add(judgeSpot,judgeSpot.target);

function ctex(w,h,draw,rep,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb)t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(8,ren.capabilities.getMaxAnisotropy());
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}
  return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function woodTex(h,s,l,rep,planks=8){
  return ctex(512,512,(g,w,hh)=>{
    const ph=hh/planks;
    for(let i=0;i<planks;i++){
      const y=i*ph;
      g.fillStyle=`hsl(${h+rnd(-3,3)},${s}%,${l+rnd(-4,4)}%)`;g.fillRect(0,y,w,ph);
      for(let k=0;k<22;k++){
        g.strokeStyle=`rgba(0,0,0,${rnd(.03,.09)})`;g.lineWidth=rnd(1,2.5);
        const yy=y+rnd(2,ph-2);g.beginPath();g.moveTo(0,yy);
        g.bezierCurveTo(w*.3,yy+rnd(-3,3),w*.6,yy+rnd(-3,3),w,yy+rnd(-2,2));g.stroke();
      }
      g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,y,w,2);g.fillRect(rnd(0,w),y,2,ph);
    }
  },rep);
}
const panelTex=ctex(256,256,(g,w,h)=>{
  g.fillStyle='#2e1450';g.fillRect(0,0,w,h);
  g.fillStyle='#4a2282';g.fillRect(18,18,w-36,h-36);
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=4;g.strokeRect(18,18,w-36,h-36);
  g.strokeStyle='rgba(255,210,63,.35)';g.lineWidth=3;g.strokeRect(24,24,w-48,h-48);
},[1,1]);
const paperTex=(rx,ry)=>ctex(256,384,(g,w,h)=>{
  g.fillStyle='#2a1146';g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){g.strokeStyle=`rgba(0,0,0,${rnd(.04,.12)})`;g.lineWidth=rnd(1,3);const x=rnd(0,w);g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+rnd(-8,8),h*.3,x+rnd(-8,8),h*.7,x+rnd(-6,6),h);g.stroke()}
  g.fillStyle='#3d1a66';g.fillRect(16,16,w-32,h-32);
  g.strokeStyle='rgba(0,0,0,.65)';g.lineWidth=8;g.strokeRect(16,16,w-32,h-32);
  g.strokeStyle='rgba(255,210,63,.55)';g.lineWidth=3;g.strokeRect(30,30,w-60,h-60);
  g.fillStyle='rgba(0,0,0,.22)';g.fillRect(52,52,w-104,h-104);
  g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=2;g.strokeRect(52,52,w-104,h-104);
  g.fillStyle='rgba(255,210,63,.35)';g.font='40px serif';g.textAlign='center';g.fillText('★',w/2,h/2+14);
},[rx,ry]);
const rugTex=ctex(256,1024,(g,w,h)=>{
  g.fillStyle='#7a0f2a';g.fillRect(0,0,w,h);
  g.strokeStyle='#e0b13a';g.lineWidth=12;g.strokeRect(10,10,w-20,h-20);
  g.lineWidth=4;g.strokeRect(30,30,w-60,h-60);
  g.fillStyle='rgba(224,177,58,.6)';g.font='64px serif';g.textAlign='center';
  for(let y=130;y<h-60;y+=140)g.fillText('★',w/2,y);
  g.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<500;i++)g.fillRect(rnd(0,w),rnd(0,h),2,2);
});
const knitTex=ctex(128,128,(g,w,h)=>{
  g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=5){g.fillStyle='rgba(0,0,0,.14)';g.fillRect(0,y,w,2)}
  for(let x=0;x<w;x+=16){g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x,0,3,h)}
},[3,3]);
const glowTex=ctex(128,128,(g,w,h)=>{
  const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,w,h);
},null,false);
const shaftTex=ctex(64,256,(g,w,h)=>{
  const a=g.createLinearGradient(0,0,0,h);a.addColorStop(0,'rgba(220,200,255,.9)');a.addColorStop(1,'rgba(220,200,255,0)');
  g.fillStyle=a;g.fillRect(0,0,w,h);

const JUDGE_ONLY=['phase','turn','sil','verdict','mode','case','punish','evctl','ev'];
function handleAct(m,role,self){
  if(!m||typeof m.a!=='string'||!R[role])return;
  const a=m.a,out={t:'do',a,from:role};
  if(JUDGE_ONLY.includes(a)&&role!=='juez')return;
  if(a==='turn'){if(m.r!==null&&!TEAMS[m.r])return;out.r=m.r}
  else if(a==='mode'){out.m=m.m==='turnos'?'turnos':'libre'}
  else if(a==='case'){if(typeof m.n!=='string')return;out.n=m.n.trim().slice(0,90);if(!out.n)return}
  else if(a==='verdict'){out.g=m.g?1:0}
  else if(a==='punish'){if(!roster[m.id]||roster[m.id].role==='juez')return;out.id=m.id}
  else if(a==='evctl'){if(!['pause','play','close'].includes(m.c))return;out.c=m.c}
  else if(a==='obj'){
    if(!['fiscal','acusado','abogf','abogd'].includes(role))return;
    const n=Date.now();if(n-(objAt[role]||0)<10000)return;objAt[role]=n;
  }
  else if(a==='ev'||a==='evsub'){if(typeof m.u!=='string'||m.u.length>2000)return;out.u=m.u}
  else if(a==='new'){if(role!=='juez')return;out.c=Math.floor(Math.random()*CASES.length)}
  else if(a==='phase'){out.p=['espera','himno','juicio'].includes(m.p)?m.p:'juicio'}
  else if(a==='salute'){const pid=self?myId:m.pid;if(!roster[pid])return;out.id=pid}
  else if(a!=='sil')return;
  bc_(out);applyAct(out);
}
function applyAct(m){
  switch(m.a){
    case 'turn':if(over)return;turn=m.r||null;mode='turnos';if(!turn)camOv=null;sfx.ding();sync();break;
    case 'mode':if(over)return;mode=m.m;if(mode==='libre')turn=null;sfx.ding();banner(mode==='libre'?'¡TODOS HABLAN!':'¡CON TURNOS!','#b98cff',1400);sync();break;
    case 'case':setCaseName(m.n);banner('NUEVO CASO','#ffd23f',1300);break;
    case 'sil':silenceFX();break;
    case 'verdict':verdictFX(!!m.g);break;
    case 'obj':if(m.from===me)objUntil=Date.now()+10000;objectionFX(m.from);break;
    case 'punish':punishFX(m.id);break;
    case 'evsub':if(me==='juez'){pending.push({u:m.u,from:m.from});renderPending();sfx.ding()}break;
    case 'ev':present(m.u,m.from);break;
    case 'evctl':evCtl(m.c);break;
    case 'phase':setPhase(m.p);break;
    case 'salute':saluteFX(m.id);break;
    case 'new':newTrial(m.c);break;
  }
}
function hostData(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    if(roster[c.peer])return;
    const role=m.role,n=Object.keys(roster).length;
    const deny=w=>{try{c.send({t:'denied',why:w})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400)};
    if(!R[role])return deny('Papel no válido.');
    if(n>=MAX_PLAYERS)return deny('La sala está llena (máx. '+MAX_PLAYERS+').');
    if(role!=='jurado'&&Object.values(roster).some(r=>r.role===role))return deny('Ese papel ya está ocupado. Elige otro.');
    if(role==='jurado'&&Object.values(roster).filter(r=>r.role==='jurado').length>=MAX_JURY)return deny('El jurado está completo (máx. '+MAX_JURY+').');
    roster[c.peer]={role};conns[c.peer]=c;
    c.send({t:'welcome',roster:rosterOut(),state:snapshot()});
    bc_({t:'roster',roster:rosterOut()},c.peer);
    renderRoster();sfx.join();
  }else if(m.t==='act'){
    const r=roster[c.peer];if(r){m.pid=c.peer;handleAct(m,r.role,false)}
  }
}
function dropPeer(id){
  dropAudio(id);
  if(!roster[id])return;
  delete roster[id];delete conns[id];
  bc_({t:'roster',roster:rosterOut()});
  renderRoster();sync();
}
function clientData(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='denied'){joinFail(String(m.why||'No se pudo entrar.'));return}
  if(m.t==='welcome'){
    clearTimeout(joinFail.to);joining=false;
    roster=m.roster||{};myId=peer.id;
    Object.keys(roster).forEach((id,idx)=>{if(id!==myId&&!calls[id])setTimeout(()=>callPeer(id),idx*300)});
    enterGame(m.state);return;
  }
  if(m.t==='roster'){
    const old=Object.keys(roster);roster=m.roster||{};
    old.forEach(id=>{if(!roster[id])dropAudio(id)});
    Object.keys(roster).forEach(id=>{if(id!==myId&&!calls[id]&&!auds[id])callPeer(id)});
    renderRoster();sync();return;
  }
  if(m.t==='do')applyAct(m);
}
function hostGone(){
  if(isHost)return;
  banner('LA SALA SE CERRÓ','#e0245e',3000);
  setTimeout(()=>location.reload(),3200);
}

/* ---------- Lobby ---------- */
function setBusy(b){['create','join'].forEach(i=>$('#'+i).disabled=b)}
function joinFail(msg){
  clearTimeout(joinFail.to);joining=false;setBusy(false);lobbyMsg(msg);
  try{peer&&peer.destroy()}catch(e){}peer=null;hostConn=null;
}
async function createRoom(){
  if(!pick)return lobbyMsg('Primero elige un papel.');
  setBusy(true);lobbyMsg('Conectando con servidor TURN…');
  await loadTurnCredentials();
  lobbyMsg('Pidiendo micrófono…');
  try{ac()}catch(e){}
  await getMic();
  lobbyMsg('Creando sala…');
  for(let i=0;i<5;i++){
    room=genCode();
    try{peer=await newPeer('tcalc-'+room);break}
    catch(e){peer=null;if(!e||e.type!=='unavailable-id'){setBusy(false);return lobbyMsg('No pude conectar con el servidor de señalización. Revisa tu conexión.')}}
  }
  if(!peer){setBusy(false);return lobbyMsg('No pude crear la sala. Inténtalo de nuevo.')}
  isHost=true;myId=peer.id;me=pick;roster[myId]={role:pick};
  peer.on('connection',c=>{c.on('data',m=>hostData(c,m));c.on('close',()=>dropPeer(c.peer));c.on('error',()=>dropPeer(c.peer))});
  enterGame({c:Math.floor(Math.random()*CASES.length),turn:null,mode:'libre',over:false});
}
async function joinRoom(){
  if(!pick)return lobbyMsg('Primero elige un papel.');
  const code=$('#code').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{5}$/.test(code))return lobbyMsg('El código tiene 5 letras o números.');
  setBusy(true);lobbyMsg('Conectando con servidor TURN…');
  await loadTurnCredentials();
  lobbyMsg('Pidiendo micrófono…');
  try{ac()}catch(e){}
  await getMic();
  lobbyMsg('Buscando sala…');joining=true;room=code;me=pick;
  try{peer=await newPeer()}catch(e){joining=false;setBusy(false);return lobbyMsg('No pude conectar con el servidor de señalización.')}
  hostConn=peer.connect('tcalc-'+code,{reliable:true});
  joinFail.to=setTimeout(()=>joinFail('No encuentro esa sala (¿sigue abierta?).'),12000);
  hostConn.on('open',()=>hostConn.send({t:'join',role:pick}));
  hostConn.on('data',clientData);
  hostConn.on('close',hostGone);
}
function enterGame(st){
  startMusic();
  $('#intro').classList.add('hidden');
  $('#roomChip').textContent='📋 Sala '+room;
  $('#again').classList.toggle('hidden',me!=='juez');
  history.replaceState(null,'','#'+room);
  st=st||{};
  newTrial(st.c||0,true);
  if(st.n)setCaseName(st.n);
  turn=st.turn||null;mode=st.mode||'libre';over=!!st.over;setPhase(st.ph||'espera',true);
  if(st.ev)present(st.ev.u,st.ev.from,true);
  if(over)verdictFX(!!(st.v&&st.v.g),true);
  renderRoster();sync();
}

/* ---------- Pruebas ---------- */
function mkEv(u,auto){
  const yt=u.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/);
  const md=u.match(/medal\.tv\/(?:[^?#]*\/)?clips?\/([\w-]+)/i);
  const vid=/\.(mp4|webm|ogv)([?#]|$)/i.test(u);
  const img=/\.(png|jpe?g|gif|webp|avif|bmp|svg)([?#]|$)/i.test(u)||/giphy\.com\/media|i\.imgur|cdn\.discordapp|media\.tenor|media\.discordapp/i.test(u);
  let el,kind;
  if(yt){kind='yt';el=document.createElement('iframe');el.src='https://www.youtube-nocookie.com/embed/'+yt[1]+'?enablejsapi=1&autoplay='+(auto?1:0);el.allow='autoplay; encrypted-media; picture-in-picture';el.allowFullscreen=true}
  else if(md){kind='medal';el=document.createElement('iframe');el.src='https://medal.tv/clip/'+md[1]+'?autoplay='+(auto?1:0)+'&muted=0';el.allow='autoplay; encrypted-media; fullscreen';el.allowFullscreen=true}
  else if(vid){kind='vid';el=document.createElement('video');el.src=u;el.controls=true;el.autoplay=!!auto;el.loop=true;el.preload='metadata'}
  else if(img){kind='img';el=document.createElement('img');el.src=u;el.alt='Prueba presentada'}
  else{kind='link';el=document.createElement('div');const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Abrir '+u.slice(0,60);el.appendChild(a)}
  return {el,kind};
}
function normUrl(raw){
  let u=(raw||'').trim();if(!u)return null;
  if(!/^[a-z]+:/i.test(u))u='https://'+u;
  return /^https?:\/\//i.test(u)?u:null;
}
function hideScreen(){$('#screen').classList.add('hidden');$('#sc').textContent=''}
function present(raw,from,quiet){
  const u=normUrl(raw);if(!u)return;
  nEv++;lastEv={u:raw,from};
  let host=u.slice(0,30);try{host=new URL(u).hostname}catch(e){}
  const {el,kind}=mkEv(u,!quiet);const n=nEv;
  if(kind==='yt'||kind==='medal'||kind==='vid')drawCard('▶ VÍDEO','Prueba #'+n+' · '+host,'#e0245e');
  else if(kind==='img'){
    drawCard('🖼 CARGANDO','Prueba #'+n);
    const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
    loader.load(u,tx=>{tx.encoding=THREE.sRGBEncoding;tx.minFilter=THREE.LinearFilter;if(nEv===n){board.material.map=tx;board.material.needsUpdate=true}},undefined,()=>drawCard('🖼 IMAGEN','Prueba #'+n));
  }else drawCard('🔗 ENLACE WEB',host,'#b98cff');
  const sc=$('#sc');sc.textContent='';sc.appendChild(el);$('#screen').classList.remove('hidden');
  if(!quiet){banner('¡NUEVA PRUEBA!','#b98cff');sfx.ev()}
}
function evCtl(c){
  if(c==='close'){hideScreen();return}
  const v=$('#sc video'),f=$('#sc iframe');
  if(v){c==='pause'?v.pause():v.play().catch(()=>{})}
  if(f&&f.src.includes('youtube')){f.contentWindow.postMessage(JSON.stringify({event:'command',func:c==='pause'?'pauseVideo':'playVideo',args:[]}),'*')}
}
function renderPending(){
  const box=$('#pv');box.textContent='';
  if(me!=='juez'||!pending.length){box.classList.add('hidden');return}
  box.classList.remove('hidden');
  const it=pending[0],u=normUrl(it.u);
  const t=document.createElement('div');t.textContent='📎 Prueba de '+R[it.from]+' ('+pending.length+' en cola)';box.appendChild(t);
  if(u){box.appendChild(mkEv(u,false).el)}else{const x=document.createElement('div');x.textContent=it.u.slice(0,80);box.appendChild(x)}
  const row=document.createElement('div');row.className='row';
  const ok=document.createElement('button');ok.className='btn green';ok.textContent='✅ Mostrar';
  ok.onclick=()=>{const p=pending.shift();renderPending();emit('ev',{u:p.u})};
  const no=document.createElement('button');no.className='btn red';no.textContent='🗑 Descartar';
  no.onclick=()=>{pending.shift();renderPending()};
  row.append(ok,no);box.appendChild(row);
}

function copyText(t){
  return new Promise(res=>{
    const fb=()=>{try{const x=document.createElement('textarea');x.value=t;x.setAttribute('readonly','');x.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(x);x.select();x.setSelectionRange(0,99);const ok=document.execCommand('copy');x.remove();res(ok)}catch(e){res(false)}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>res(true),fb);else fb();
  });
}
const chipTxt=()=>$('#roomChip').textContent='📋 Sala '+room;
$('#roomChip').onclick=async()=>{
  const ok=await copyText(room);
  if(ok){$('#roomChip').textContent='✅ Código copiado'}
  else{$('#roomChip').textContent='Sala '+room;try{prompt('Copia el código de sala:',room)}catch(e){}}
  setTimeout(chipTxt,1500);
};
$('#reVoice').onclick=()=>{
  unlockAudio();
  Object.keys(roster).forEach(id=>{if(id!==myId){dropAudio(id);delete vfail[id];callPeer(id)}});
};
addEventListener('beforeunload',()=>{try{peer&&peer.destroy()}catch(e){}});
let lastW=0,lastH=0,lastDPR=0;
function fitRenderer(force){
  const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,2);
  if(!force&&w===lastW&&h===lastH&&d===lastDPR)return;
  lastW=w;lastH=h;lastDPR=d;
  ren.setPixelRatio(d);ren.setSize(w,h);
  cam.aspect=w/h;cam.updateProjectionMatrix();
}
addEventListener('resize',()=>fitRenderer(true));
addEventListener('focus',()=>fitRenderer(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fitRenderer(true)});
setInterval(()=>fitRenderer(false),400);
ren.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault()},false);
ren.domElement.addEventListener('webglcontextrestored',()=>{
  [btex,sealMat.map,skyTex,knitTex].forEach(t=>{if(t)t.needsUpdate=true});
  fitRenderer(true);
},false);
fitRenderer(true);
{const h=location.hash.slice(1).toUpperCase();if(/^[A-Z0-9]{5}$/.test(h))$('#code').value=h}
$('#caseI').textContent='📁 '+CASES[Math.floor(Math.random()*CASES.length)];

/* ===================== BUCLE ===================== */
const OV={cam:[0,6.5,15.5],look:[0,2.2,-2]};
const clk=new THREE.Clock(),cp=new THREE.Vector3(...OV.cam),cl=new THREE.Vector3(...OV.look),tp=new THREE.Vector3(),tl=new THREE.Vector3(),wv=new THREE.Vector3();
function sockOf(id){
  const r=roster[id];if(!r||!A[r.role])return null;
  const a=A[r.role];if(r.role!=='jurado')return a.sks[0];
  const ids=Object.keys(roster).filter(k=>roster[k].role==='jurado');
  return a.sks[Math.min(ids.indexOf(id),a.sks.length-1)];
}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.1),t=clk.elapsedTime,now=performance.now();
  const ov=camOv&&now<camOv.until;
  const hold=mode==='turnos'&&turn&&!over;
  const v=ov?camOv:(phase==='himno'?tourView(t):(hold?V[turn]:OV));
  tp.fromArray(v.cam);tl.fromArray(v.look);
  if(!ov&&!hold){tp.x+=Math.sin(t*.18)*1.6;tp.y+=Math.sin(t*.13)*.25}
  const k=1-Math.pow(.02,dt);cp.lerp(tp,k);cl.lerp(tl,k);
  cam.position.copy(cp);
  if(ov&&camOv.shake){const a=camOv.shake*Math.max(0,1-(now-camOv.t0)/1200);cam.position.x+=(Math.random()-.5)*a;cam.position.y+=(Math.random()-.5)*a}
  cam.lookAt(cl);
  hemi.intensity+=((hold?.32:.75)-hemi.intensity)*.06;
  judgeSpot.intensity+=((hold?.4:1.6)-judgeSpot.intensity)*.06;
  sealGlow.material.opacity=.3+Math.sin(t*1.2)*.08;

  sampleLevels();
  for(const id in A)A[id].sks.forEach(s=>s.userData.alv=0);
  for(const id in ana){if(id==='__me')continue;const s=sockOf(id);if(s)s.userData.alv=Math.max(s.userData.alv,ana[id].lv)}
  for(const id in vlv){if(id===myId||!roster[id]||!calls[id])continue;const s=sockOf(id);if(s)s.userData.alv=Math.max(s.userData.alv,Math.min(1,(vlv[id]||0)*5))}
  if(ana.__me&&micOK&&!selfMute&&canTalk()){const s=sockOf(myId);if(s)s.userData.alv=Math.max(s.userData.alv,ana.__me.lv)}
  const nowD=Date.now();
  for(const id in rowEl){const el=rowEl[id];el.classList.toggle('spk',!!ana[id]&&ana[id].lv>.12);
    el.classList.toggle('pend',id!==myId&&!auds[id]&&!vfail[id]);el.classList.toggle('fail',id!==myId&&!!vfail[id]);
    el.classList.toggle('pun',(punished[id]||0)>nowD)}
  if(ana.__me&&micOK&&!selfMute&&canTalk()){$('#meter').style.width=Math.round(ana.__me.lv*100)+'%'}else $('#meter').style.width='0';
  if(now-(loop.lc||0)>500){loop.lc=now;
    for(const k in calls){const pc=calls[k].peerConnection;if(pc&&pc.getStats)pc.getStats().then(r=>r.forEach(x=>{if(x.type==='inbound-rtp'&&(x.kind==='audio'||x.mediaType==='audio')){vlv[k]=x.audioLevel||0;vby[k]=x.bytesReceived||0}})).catch(()=>{})}
    for(const k in auds)if(auds[k].paused&&auds[k].srcObject)auds[k].play().catch(()=>{});
    const o=Object.keys(roster).filter(k=>k!==myId);
    $('#micC').textContent=!o.length?'👤 Estás solo en la sala':'🔗 Voz: '+o.map(k=>ICON[roster[k].role]+(auds[k]?'✅'+(auds[k].paused?'⛔':''):vfail[k]?'❌':'⏳'+(vst[k]?' '+vst[k]:''))).join(' · ');
    applyMic();updateMicUI();
    if(phase==='himno'&&anthem.paused&&!anthem.ended&&me)anthem.play().catch(()=>{});
    const left=Math.ceil((objUntil-nowD)/1000);
    $('#obj').disabled=left>0||over;$('#obj').textContent=left>0?'¡OBJECIÓN! ('+left+'s)':'¡OBJECIÓN!';
  }

  for(const id in A){
    const a=A[id];
    a.sl.intensity+=((mode==='turnos'&&turn&&!over&&TEAMS[turn].includes(id)?3.2:0)-a.sl.intensity)*.12;
    a.sks.forEach((s,i)=>{
      const u=s.userData,fake=(talk[id]>now&&i===0)?.5+.5*Math.abs(Math.sin(t*14)):0;
      const lv=Math.max(u.alv,fake);u.lv+=(lv-u.lv)*.5;
      const sp=u.lv>.08,hit=u.hit>now;
      const cheer=over&&lastVerdict&&!lastVerdict.g&&id!=='juez',trem=over&&lastVerdict&&lastVerdict.g&&id==='acusado';
      if(u.ry0===undefined)u.ry0=s.rotation.y;
      s.position.y=(s.userData.y0===undefined?(s.userData.y0=s.position.y):s.userData.y0)+(sp?Math.abs(Math.sin(t*12+i))*.09*u.lv*2:Math.sin(t*1.5+i)*.02)+(cheer?Math.abs(Math.sin(t*7+i))*.22:0);
      s.rotation.z=Math.sin(t*1.1+i*2)*.03+(sp?Math.sin(t*9)*.05:0)+(hit?Math.sin(t*50)*.15:0)+(trem?Math.sin(t*35)*.06:0);
      s.rotation.y=u.ry0+Math.sin(t*.7+i)*.06+(sp?Math.sin(t*5+i)*.1*u.lv:0);
      const sq=1+Math.sin(t*2.1+i)*.018+(sp?Math.sin(t*14)*.04*u.lv:0)-(trem?.06:0);
      s.rotation.x+=((sp?.1*u.lv:0)+(trem?.12:0)-s.rotation.x)*.15;
      if(u.s0){s.scale.y=u.s0*sq;s.scale.x=s.scale.z=u.s0*(1-(sq-1)*.5)}
      u.mouth.scale.y=hit?1.4:.2+u.lv*(1+.7*Math.abs(Math.sin(t*20+i)));u.mouth.scale.x=1-u.lv*.2+(sp?Math.sin(t*20)*.05:0);
      const sal=u.salute>now;
      u.arms.forEach(ar=>{const sd=ar.position.x>0?1:-1;ar.rotation.z+=((sal?(sd>0?3.5:-.3):sd*(.3+u.lv*1.3+Math.sin(t*1.6+i)*.04+(hit?1.6:0)+(cheer?2.4:0)))-ar.rotation.z)*.2;ar.rotation.x+=((sal&&sd>0?.7:-u.lv*.5*Math.sin(t*10+sd))-ar.rotation.x)*.3});
      u.brows.forEach((b,j)=>{const sd=j?1:-1;b.rotation.z+=((sd*-u.lv*.3)-b.rotation.z)*.25;b.position.y=1.68+u.lv*.05});
      u.blink-=dt;
      const bl=u.blink<0?Math.max(0,1-Math.abs(u.blink+.08)*12):0;
      u.eyes.forEach(e=>e.scale.y=Math.max(.08,1-bl));
      s.getWorldPosition(wv);const ang=Math.atan2(cam.position.x-wv.x,cam.position.z-wv.z)-s.rotation.y,ey=Math.max(-.6,Math.min(.6,Math.atan2(Math.sin(ang),Math.cos(ang))));
      u.eyes.forEach(e=>{e.rotation.y+=(ey-e.rotation.y)*.1;e.rotation.x+=((cam.position.y-wv.y-1)*-.03-e.rotation.x)*.1});
      if(u.tail){u.tail.rotation.z=Math.sin(t*2+i)*.15+u.lv*Math.sin(t*18)*.12;u.tail.rotation.x=Math.sin(t*1.7+i)*.1}
      if(u.blink<-.16)u.blink=rnd(2,5);
      if(u.sweat){u.sweat.position.y=1.85-((t*.6)%1)*.5;u.sweat.material.opacity=1-((t*.6)%1)}
    });
  }
  audience.forEach(s=>{const ph=s.userData.ph,ch=over&&lastVerdict;s.position.y=.7+(ch?Math.abs(Math.sin(t*(lastVerdict.g?2:6)+ph))*(lastVerdict.g?.03:.28):Math.max(0,Math.sin(t*1.4+ph))*.04);s.rotation.z=Math.sin(t*(ch?5:.8)+ph)*(ch?.1:.04)});
  candleLights.forEach((l,i)=>l.intensity=1.1+Math.sin(t*7+i*3)*.07+Math.sin(t*13+i)*.04);
  shafts.forEach((s,i)=>s.material.opacity=.13+Math.sin(t*.5+i*2)*.04);
  dust.rotation.y=t*.01;dust.position.y=Math.sin(t*.2)*.3;
  const cq=(now-confT)/6000;
  if(cq>=0&&cq<1){
    for(let i=0;i<cN;i++){cPos[i*3]+=cVel[i][0]*dt+Math.sin(t*3+i)*.01;cPos[i*3+1]+=cVel[i][1]*dt;cPos[i*3+2]+=cVel[i][2]*dt;if(cPos[i*3+1]<.2)cPos[i*3+1]=.2}
    cGeo.attributes.position.needsUpdate=true;confetti.material.opacity=Math.min(1,(1-cq)*2);
  }else confetti.material.opacity=0;
  const p=(now-gvT)/220;
  gv.rotation.x=p<1?-1+2.2*p:p<2?1.2-1.4*(p-1):-.2;
  for(let i=fxs.length-1;i>=0;i--){
    const f=fxs[i],q=(now-f.t0);
    if(f.k==='star'){const r=q/1400;f.sp.position.set(f.pos.x,f.pos.y+r*1.6,f.pos.z);f.sp.material.opacity=Math.max(0,1-r);if(r>=1){scene.remove(f.sp);fxs.splice(i,1)}}else if(f.k==='bomb'){
      const r=Math.min(1,q/700);f.sp.position.set(f.pos.x,f.pos.y+8*(1-r),f.pos.z);
      if(r>=1){scene.remove(f.sp);fxs.splice(i,1);explode(f.pos,f.sock,f.role)}
    }else{
      const r=q/800;f.sp.scale.setScalar(1+f.sz*Math.min(1,r));f.sp.material.opacity=Math.max(0,1-r);
      if(r>=1){scene.remove(f.sp);fxs.splice(i,1)}
    }
  }
  ind.visible=false;
  if(hold){
    const id=Object.keys(roster).find(k=>TEAMS[turn].includes(roster[k].role)),s=id?sockOf(id):null;
    if(s){ind.visible=true;s.getWorldPosition(wv);ind.position.set(wv.x,wv.y+(2.5*s.scale.y)+Math.sin(t*4)*.12,wv.z)}
  }
  ren.render(scene,cam);
}
drawCard('SIN PRUEBAS','Nada en el expediente todavía');
loop();
sync();
</script>
